version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: eve_postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-eve_db}
      POSTGRES_USER: ${DATABASE_USER:-eve_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-eve_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-eve_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eve_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eve_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FASTAPI_ENV: ${FASTAPI_ENV:-production}
      SECRET_KEY: ${SECRET_KEY}
      APP_IP: 192.168.109.132
      APP_PORT: 8000
      EVE_NG_IP: 192.168.2.11
      EVE_NG_FQDN: evengvlab4you.ddns.net
      EVE_NG_PORT: 8443
      EVE_NG_PROTOCOL: https
      CORS_ORIGINS: '["http://192.168.109.132:3000", "http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - eve_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eve_frontend
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://192.168.109.132:8000
      REACT_APP_API_BASE_URL: /api
      REACT_APP_EVE_NG_IP: 192.168.2.11
      REACT_APP_EVE_NG_FQDN: evengvlab4you.ddns.net
      REACT_APP_EVE_NG_PORT: 8443
      REACT_APP_EVE_NG_PROTOCOL: https
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    command: npm start
    networks:
      - eve_network

volumes:
  postgres_data:

networks:
  eve_network:
    driver: bridge
